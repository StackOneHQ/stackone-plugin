name: check
on:
  push:
  pull_request:
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-manifests.py
      - name: MCP endpoint answers with OAuth discovery
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://mcp.stackone.com/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          test "$code" = "401"
          curl -sf https://mcp.stackone.com/.well-known/oauth-protected-resource | grep -q '"authorization_servers"'
